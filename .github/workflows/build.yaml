name: build

on:
  push:
    branches: [develop, main]
    tags:
      - 'v*'

jobs:
  release:
    uses: eoap/eoap-cwl-release-workflow/.github/workflows/release-cwl.yml@main
    with:
      tools: '["convert-search", "stac-catalog"]'
      image-prefix: terradue/eoap-open-sar-toolkit
      registry: ghcr.io
      cwl-workflow-dir: cwl-workflow
      cwl-tool-dir: command-line-tools
      entrypoint: opensartoolkit
    secrets:
      registry-user: ${{ github.actor }}
      registry-password: ${{ secrets.GITHUB_TOKEN }}